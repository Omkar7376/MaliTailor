<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="MaliTailors – Tailor Management System. Elegant, bespoke tailoring boutique management software.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MaliTailors">
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>MaliTailors – Tailor Management System</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #17110d;
      background: radial-gradient(circle at center, #2e2017 0%, #17110d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    flutter-view {
      background-color: #17110d !important;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .app-icon-wrapper {
      width: 105px;
      height: 105px;
      border-radius: 26px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), 0 0 25px rgba(212, 175, 55, 0.25);
      overflow: hidden;
      margin-bottom: 22px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      background: #1e140e;
    }

    .app-icon-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-title {
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .app-subtitle {
      color: #E2C288;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.8px;
      margin-bottom: 30px;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 2.5px solid rgba(226, 194, 136, 0.2);
      border-top-color: #E2C288;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="loading-container">
    <div class="app-icon-wrapper">
      <img src="icons/Icon-192.png" alt="Mali Tailors Logo" />
    </div>
    <div class="app-title">Mali Tailors</div>
    <div class="app-subtitle">BESPOKE ATELIER & MANAGEMENT</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
